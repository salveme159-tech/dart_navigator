# Render.com Blueprint: DART Navigator를 서버+사이트 한 곳에서 서비스합니다(같은 주소라 CORS 설정 불필요).
services:
  - type: web
    name: dart-navigator
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # 사용자가 화면에서 입력한 키를 쓰므로 서버 키는 선택 사항입니다.
      - key: OPENDART_API_KEY
        sync: false
      # Separate long random secret used only by the ChatGPT Action endpoint.
      - key: AGENT_API_KEY
        sync: false
